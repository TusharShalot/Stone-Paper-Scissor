<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stone Paper Scissor</h1>
    <div class="container">
        <div class="box" id="rock"><img src="/images/rock.png" alt="Rock" class="img"></div>
        <div class="box" id="paper"><img src="/images//paper.png" alt="Paper" class="img" ></div>
        <div class="box" id="scissor"><img src="/images/scissors.png" alt="Scissor" class="img"></div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="msg-container" >
        <p id="msg">Play your move</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
